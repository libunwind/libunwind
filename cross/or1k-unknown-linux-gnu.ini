[binaries]
c = 'or1k-unknown-linux-gnu-gcc'
cpp = 'or1k-unknown-linux-gnu-g++'
ar = 'or1k-unknown-linux-gnu-ar'
nm = 'or1k-unknown-linux-gnu-nm'
strip = 'or1k-unknown-linux-gnu-strip'
exe_wrapper = ['meson-qemu-exe-wrapper', '--qemu=qemu-or1k', '--gcc=or1k-unknown-linux-gnu-gcc']

[host_machine]
system = 'linux'
cpu_family = 'or1k'
cpu = 'or1k'
endian = 'big'
