[binaries]
c = 'ia64-unknown-linux-gnu-gcc'
cpp = 'ia64-unknown-linux-gnu-g++'
ar = 'ia64-unknown-linux-gnu-ar'
nm = 'ia64-unknown-linux-gnu-nm'
strip = 'ia64-unknown-linux-gnu-strip'
exe_wrapper = ['meson-qemu-exe-wrapper', '--qemu=qemu-ia64', '--gcc=ia64-unknown-linux-gnu-gcc']

[host_machine]
system = 'linux'
cpu_family = 'ia64'
cpu = 'ia64'
endian = 'little'
