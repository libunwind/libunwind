[binaries]
c = 'riscv32-unknown-linux-gnu-gcc'
cpp = 'riscv32-unknown-linux-gnu-g++'
ar = 'riscv32-unknown-linux-gnu-ar'
strip = 'riscv32-unknown-linux-gnu-strip'
exe_wrapper = ['meson-qemu-exe-wrapper', '--qemu=qemu-riscv32', '--gcc=riscv32-unknown-linux-gnu-gcc']

[host_machine]
system = 'linux'
cpu_family = 'riscv32'
cpu = 'riscv32'
endian = 'little'
