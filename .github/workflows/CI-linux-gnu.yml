name: CI - Linux - GNU

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!doc/**'
      - '!.**'
      - '.github/workflows/CI-linux-gnu.yml'
  push:
    branches:
      - v[0-9].*
      - master

jobs:
  build-gnu-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Anything more than about 20 minutes is likely a testsuite hang.
    name: ${{ matrix.target.triple }} (native) ${{ matrix.toolchain.compiler }} ${{ matrix.optimization.CFLAGS }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: i686,   triple: i686-pc-linux-gnu,   CFLAGS: -m32 }
          - { arch: x86_64, triple: x86_64-pc-linux-gnu, CFLAGS:      }
        toolchain:
          - { compiler: gcc,   CC: gcc-14,   CXX: g++-14     }
          - { compiler: clang, CC: clang-18, CXX: clang++-18 }
        optimization:
          - { CFLAGS: -O0 }
          - { CFLAGS: -O3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ${{ matrix.target.triple }} Toolchain
        run: |
          sudo apt update
          sudo apt install -y g++-14-multilib abigail-tools

      - name: Configure
        run: |
          set -x
          autoreconf -i
          mkdir build
          cd build
          ../configure --build=x86_64-pc-linux-gnu --host=${{ matrix.target.triple }} --enable-debug --enable-coredump
        env:
          CC: ${{ matrix.toolchain.CC }}
          CXX: ${{ matrix.toolchain.CXX }}
          CFLAGS: "${{ matrix.target.CFLAGS }} ${{ matrix.optimization.CFLAGS }} -g -Wall -Wextra -fstrict-aliasing -Wstrict-aliasing -Werror=strict-aliasing"
          CXXFLAGS: "${{ matrix.target.CFLAGS }} ${{ matrix.optimization.CFLAGS }} -g -Wall -Wextra -fstrict-aliasing -Wstrict-aliasing -Werror=strict-aliasing"
          LDFLAGS: ${{ matrix.target.CFLAGS }}

      - name: Build
        run: |
          make -C build -j$(nproc)

      - name: Check ABI
        if: ${{ success() }}
        run:
          make -C build/src abi-check

      - name: Test (native)
        if: ${{ success() }}
        run: |
          set -x
          sudo bash -c 'echo core.%p.%p > /proc/sys/kernel/core_pattern'
          ulimit -c unlimited
          make -C build check -j$(nproc)
        env:
          UNW_DEBUG_LEVEL: 4

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.config.triple }}-${{ matrix.toolchain.compiler }}${{ matrix.optimization.CFLAGS }}
          path: |
            **/test-suite.log
            **/config.log
          if-no-files-found: warn


  build-gnu-cross:
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.config.container }}
      options: --privileged
    timeout-minutes: 30 # Anything more than about 30 minutes is likely a testsuite hang.
    name: ${{ matrix.config.host }} (cross)

    strategy:
      fail-fast: false
      matrix:
        config:
          - {target: aarch64,  host: aarch64-linux-gnu,       qemu: aarch64,  gccver: 14, container: ubuntu:26.04, dpkg_arch: arm64    }
          - {target: alpha,    host: alpha-linux-gnu,         qemu: alpha,    gccver: 14, container: ubuntu:26.04 }
          - {target: armhf,    host: arm-linux-gnueabihf,     qemu: arm,      gccver: 14, container: ubuntu:26.04, dpkg_arch: armhf    }
          - {target: arm,      host: arm-linux-gnueabi,       qemu: arm,      gccver: 14, container: ubuntu:26.04 }
          - {target: hppa,     host: hppa-linux-gnu,          qemu: hppa,     gccver: 14, container: ubuntu:26.04 }
          - {target: loongarch64, host: loongarch64-linux-gnu, qemu: loongarch64, gccver: 14, container: ubuntu:26.04 }
          - {target: mips64el, host: mips64el-linux-gnuabi64, qemu: mips64el, gccver: 14, container: ubuntu:24.04 }
          - {target: mips64,   host: mips64-linux-gnuabi64,   qemu: mips64,   gccver: 14, container: ubuntu:24.04 }
          - {target: mipsn32el, host: mips64el-linux-gnuabin32, qemu: mipsn32el, gccver: 14, container: ubuntu:24.04, cc: "mips64el-linux-gnuabi64-gcc-14 -mabi=n32", cxx: "mips64el-linux-gnuabi64-g++-14 -mabi=n32", packages: "g++-14-multilib-mips64el-linux-gnuabi64", cross_lib: "/usr/mips64el-linux-gnuabi64" }
          - {target: mipsn32,   host: mips64-linux-gnuabin32,   qemu: mipsn32,   gccver: 14, container: ubuntu:24.04, cc: "mips64-linux-gnuabi64-gcc-14 -mabi=n32",   cxx: "mips64-linux-gnuabi64-g++-14 -mabi=n32",   packages: "g++-14-multilib-mips64-linux-gnuabi64",   cross_lib: "/usr/mips64-linux-gnuabi64" }
          - {target: mipsel,   host: mipsel-linux-gnu,        qemu: mipsel,   gccver: 14, container: ubuntu:24.04 }
          - {target: mips,     host: mips-linux-gnu,          qemu: mips,     gccver: 14, container: ubuntu:24.04 }
          - {target: ppc64,    host: powerpc64-linux-gnu,     qemu: ppc64,    gccver: 14, container: ubuntu:26.04, qemu_skip: &ppc64_qemu_skip "Gtest-bt:Gtest-concurrent:Gtest-resume-sig:Gtest-resume-sig-rt:Gtest-trace:Ltest-bt:Ltest-concurrent:Ltest-init-local-signal:Ltest-resume-sig:Ltest-resume-sig-rt:Ltest-sig-context:Ltest-trace:test-async-sig" }
          - {target: ppc64le,  host: powerpc64le-linux-gnu,   qemu: ppc64le,  gccver: 14, container: ubuntu:26.04, dpkg_arch: ppc64el,  qemu_skip: *ppc64_qemu_skip }
          - {target: ppc,      host: powerpc-linux-gnu,       qemu: ppc,      gccver: 14, container: ubuntu:26.04 }
          - {target: riscv64,  host: riscv64-linux-gnu,       qemu: riscv64,  gccver: 14, container: ubuntu:26.04, dpkg_arch: riscv64  }
          - {target: s390x,    host: s390x-linux-gnu,         qemu: s390x,    gccver: 14, container: ubuntu:26.04, dpkg_arch: s390x    }
          - {target: sh4,      host: sh4-linux-gnu,           qemu: sh4,      gccver: 14, container: ubuntu:26.04, qemu_skip: "Gtest-sig-context:Gtest-trace:Ltest-init-local-signal:Ltest-sig-context:Ltest-trace" }
          - {target: sparc64,  host: sparc64-linux-gnu,       qemu: sparc64,  gccver: 14, container: ubuntu:26.04, qemu_skip: "Gtest-exc:Gtest-resume-sig:Gtest-resume-sig-rt:Ltest-cxx-exceptions:Ltest-exc:Ltest-resume-sig:Ltest-resume-sig-rt" }

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ${{ matrix.config.host }} Toolchain
        run: |
          if [ -n "$DPKG_ARCH" ]; then
            dpkg --add-architecture "$DPKG_ARCH"
            CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
            # Restrict existing sources to amd64 so archive.ubuntu.com doesn't
            # 404 on ports-only arches; ports.ubuntu.com handles $DPKG_ARCH.
            for f in /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] && sed -i '/^Architectures:/!s/^Types:/Architectures: amd64\nTypes:/' "$f"
            done
            sed -i 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list 2>/dev/null || true
            echo "deb [arch=$DPKG_ARCH] http://ports.ubuntu.com/ubuntu-ports $CODENAME main restricted universe" \
              >> /etc/apt/sources.list.d/ports.list
            echo "deb [arch=$DPKG_ARCH] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main restricted universe" \
              >> /etc/apt/sources.list.d/ports.list
            apt-get update
          fi
          apt-get install -y autoconf automake libtool make \
                             ${{ matrix.config.packages || format('g++-{0}-{1}', matrix.config.gccver, matrix.config.host) }} \
                             qemu-user \
                             xz-utils \
                             abigail-tools \
                             ${DPKG_ARCH:+liblzma-dev:$DPKG_ARCH}
        env:
          DEBIAN_FRONTEND: noninteractive
          DPKG_ARCH: ${{ matrix.config.dpkg_arch || '' }}

      - name: Configure with ${{ matrix.config.cc }}
        run: |
          set -x
          autoreconf -i
          mkdir build
          cd build
          ../configure --build=$(config/config.guess) \
                       --host=${{ matrix.config.host }} \
                       --with-testdriver="$(pwd)/libtool execute $(pwd)/../scripts/qemu-test-driver" \
                       --enable-debug --enable-coredump
        env:
          CC: ${{ matrix.config.cc || format('{0}-gcc-{1}', matrix.config.host, matrix.config.gccver) }}
          CXX: ${{ matrix.config.cxx || format('{0}-g++-{1}', matrix.config.host, matrix.config.gccver) }}

      - name: Build
        run: |
          make -C build -j$(nproc)
        env:
          CFLAGS: "-Wall -Wextra -g -Og -fstrict-aliasing -Wstrict-aliasing -Werror=strict-aliasing"

      - name: ABI Check
        run: |
            case ${{ matrix.config.target }} in
            aarch64|riscv*|s390x|x86*)
                make -C build/src abi-check
                ;;
            *)
                srcdir=$(pwd)
                cd build/tests
                ./check-namespace.sh
                ;;
            esac

      - name: Test
        run: |
          set -x
          bash -c 'echo core.%p.%p > /proc/sys/kernel/core_pattern'
          ulimit -c unlimited
          cd build
          make check -j$(nproc) LOG_DRIVER_FLAGS="--qemu-arch ${{ matrix.config.qemu }}${{ matrix.config.qemu_skip && format(' --qemu-skip={0}', matrix.config.qemu_skip) || '' }}" \
                     QEMU_LD_PREFIX="$CROSS_LIB" \
                     LDFLAGS="-L$CROSS_LIB/lib"
        env:
          UNW_DEBUG_LEVEL: 4
          CROSS_LIB: ${{ matrix.config.cross_lib || format('/usr/{0}', matrix.config.host) }}

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.config.host }}
          path: |
            **/test-suite.log
            **/config.log
          if-no-files-found: warn


  build-gnu-native-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Anything more than about 20 minutes is likely a testsuite hang.
    name: ${{ matrix.target.triple }} (native, asan+ubsan) ${{ matrix.toolchain.compiler }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: i686,   triple: i686-pc-linux-gnu,   CFLAGS: -m32 }
          - { arch: x86_64, triple: x86_64-pc-linux-gnu, CFLAGS:      }
        toolchain:
          - { compiler: gcc,   CC: gcc-14,   CXX: g++-14     }
          - { compiler: clang, CC: clang-18, CXX: clang++-18 }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ${{ matrix.target.triple }} Toolchain
        run: |
          sudo apt update
          sudo apt install -y g++-14-multilib abigail-tools

      - name: Configure
        run: |
          set -x
          autoreconf -i
          mkdir build
          cd build
          ../configure --build=x86_64-pc-linux-gnu --host=${{ matrix.target.triple }} --enable-debug
        env:
          CC: ${{ matrix.toolchain.CC }}
          CXX: ${{ matrix.toolchain.CXX }}
          CFLAGS: "${{ matrix.target.CFLAGS }} -g -Wall -Wextra -fsanitize=undefined,address -fno-sanitize-recover=all"
          CXXFLAGS: "${{ matrix.target.CFLAGS }} -g -Wall -Wextra -fsanitize=undefined,address -fno-sanitize-recover=all"
          LDFLAGS: "${{ matrix.target.CFLAGS }} -fsanitize=undefined,address"

      - name: Build
        run: |
          make -C build -j$(nproc)

      - name: Test (native)
        if: ${{ success() }}
        run: |
          set -x
          sudo bash -c 'echo core.%p.%p > /proc/sys/kernel/core_pattern'
          ulimit -c unlimited
          make -C build check -j8
        env:
          UNW_DEBUG_LEVEL: 4
          # replace_intrin=0 keeps AddressSanitizer from checking the
          # memcpy() calls the unwinder uses to read the target's stack:
          # reading another frame's memory is what an unwinder does, and
          # ASan cannot tell that from an overflow.
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0:replace_intrin=0

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.target.triple }}-${{ matrix.toolchain.compiler }}-asan+ubsan
          path: |
            **/test-suite.log
            **/config.log
          if-no-files-found: warn


  build-gnu-cross-ubsan:
    runs-on: ubuntu-26.04
    container:
      image: ${{ matrix.config.container }}
      options: --privileged
    timeout-minutes: 30 # Anything more than about 30 minutes is likely a testsuite hang.
    name: ${{ matrix.config.host }} (cross, asan+ubsan)

    strategy:
      fail-fast: false
      matrix:
        config:
          # AddressSanitizer's shadow mapping does not survive QEMU's
          # user-mode emulation on aarch64 or riscv64: every test dies with
          # SIGSEGV before reaching main().  Only UBSan is enabled there.
          - {target: aarch64,   host: aarch64-linux-gnu,        qemu: aarch64,   gccver: 14, container: ubuntu:26.04, sanitizers: undefined }
          - {target: armhf,     host: arm-linux-gnueabihf,      qemu: arm,       gccver: 14, container: ubuntu:26.04 }
          - {target: arm,       host: arm-linux-gnueabi,        qemu: arm,       gccver: 14, container: ubuntu:26.04 }
          - {target: ppc64,     host: powerpc64-linux-gnu,      qemu: ppc64,     gccver: 14, container: ubuntu:26.04, qemu_skip: *ppc64_qemu_skip }
          - {target: ppc64le,   host: powerpc64le-linux-gnu,    qemu: ppc64le,   gccver: 14, container: ubuntu:26.04, qemu_skip: *ppc64_qemu_skip }
          - {target: ppc,       host: powerpc-linux-gnu,        qemu: ppc,       gccver: 14, container: ubuntu:26.04 }
          - {target: riscv64,   host: riscv64-linux-gnu,        qemu: riscv64,   gccver: 14, container: ubuntu:26.04, sanitizers: undefined }
          # AddressSanitizer maps a shadow region covering the entire address
          # space.  On s390x that mapping is 512TB, which QEMU's user-mode
          # emulation cannot provide, so only UBSan is enabled there.
          - {target: s390x,     host: s390x-linux-gnu,          qemu: s390x,     gccver: 14, container: ubuntu:26.04, sanitizers: undefined }

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ${{ matrix.config.host }} Toolchain
        run: |
          apt-get install -y autoconf automake libtool make \
                             ${{ matrix.config.packages || format('g++-{0}-{1}', matrix.config.gccver, matrix.config.host) }} \
                             qemu-user \
                             abigail-tools
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Configure
        run: |
          set -x
          autoreconf -i
          mkdir build
          cd build
          ../configure --build=$(config/config.guess) \
                       --host=${{ matrix.config.host }} \
                       --with-testdriver="$(pwd)/libtool execute $(pwd)/../scripts/qemu-test-driver" \
                       --enable-debug
        env:
          CC: ${{ matrix.config.cc || format('{0}-gcc-{1}', matrix.config.host, matrix.config.gccver) }}
          CXX: ${{ matrix.config.cxx || format('{0}-g++-{1}', matrix.config.host, matrix.config.gccver) }}
          CFLAGS: "-Wall -Wextra -g -Og -fsanitize=${{ matrix.config.sanitizers || 'undefined,address' }} -fno-sanitize-recover=all"
          CXXFLAGS: "-Wall -Wextra -g -Og -fsanitize=${{ matrix.config.sanitizers || 'undefined,address' }} -fno-sanitize-recover=all"
          LDFLAGS: "-fsanitize=${{ matrix.config.sanitizers || 'undefined,address' }}"

      - name: Build
        run: |
          make -C build -j$(nproc)

      - name: Test
        run: |
          set -x
          bash -c 'echo core.%p.%p > /proc/sys/kernel/core_pattern'
          ulimit -c unlimited
          cd build
          # AddressSanitizer re-executes the program to disable address space
          # randomization, and that re-exec fails under QEMU's user-mode
          # emulation (ENOEXEC).  Disable randomization up front (the
          # personality flag is inherited by the test programs) so that ASan
          # does not need to.
          setarch -R \
          make check LOG_DRIVER_FLAGS="--qemu-arch ${{ matrix.config.qemu }}${{ matrix.config.qemu_skip && format(' --qemu-skip={0}', matrix.config.qemu_skip) || '' }}" \
                     QEMU_LD_PREFIX="$CROSS_LIB" \
                     LDFLAGS="-L$CROSS_LIB/lib -fsanitize=${{ matrix.config.sanitizers || 'undefined,address' }}"
        env:
          UNW_DEBUG_LEVEL: 4
          # replace_intrin=0 keeps AddressSanitizer from checking the
          # memcpy() calls the unwinder uses to read the target's stack:
          # reading another frame's memory is what an unwinder does, and
          # ASan cannot tell that from an overflow.
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0:replace_intrin=0
          CROSS_LIB: ${{ matrix.config.cross_lib || format('/usr/{0}', matrix.config.host) }}

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.config.host }}-asan+ubsan
          path: |
            **/test-suite.log
            **/config.log
          if-no-files-found: warn
